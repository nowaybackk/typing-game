<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>순서 타자 여행</title>
<style>
:root{--bg:#f5eddc;--panel:#fffaf0;--panel2:#fffdf7;--text:#24211d;--muted:#7a7369;--border:#ddd0bb;--accent:#d88742;--accent-dark:#ad632b;--accent-soft:#f5dcc4;--past:#aaa39a;--track:#34312d;--danger:#bd3e35}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Arial,"Noto Sans KR",sans-serif}.app{width:min(1040px,100%);margin:auto;padding:24px}.screen{display:none}.screen.active{display:block}button,input,select{font:inherit}button{cursor:pointer}.header{margin-bottom:20px}.header h1{margin:0 0 8px;font-size:clamp(28px,5vw,44px)}.header p{margin:0;color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.card{padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--panel);text-align:left}.card h2{margin:12px 0 8px}.card p{min-height:48px;margin:0 0 18px;color:var(--muted)}.card.disabled{opacity:.55;cursor:default}.icon{display:grid;width:52px;height:52px;place-items:center;border-radius:15px;background:var(--accent-soft);color:var(--accent-dark);font-size:26px}.toolbar,.stats,.layout,.result{margin-bottom:16px}.toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;padding:16px;border:1px solid var(--border);border-radius:16px;background:var(--panel)}.group{display:flex;flex-wrap:wrap;align-items:end;gap:10px}label{font-size:14px;font-weight:700}select,input{width:100%;margin-top:7px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);color:var(--text);outline:none}select:focus,input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.btn{padding:12px 16px;border:1px solid var(--border);border-radius:12px;background:var(--panel2);font-weight:700}.btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}.btn:disabled{opacity:.55;cursor:not-allowed}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border:1px solid var(--border);border-radius:14px;background:var(--panel)}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;margin-top:5px;font-size:26px}.layout{display:grid;grid-template-columns:minmax(280px,390px) 1fr;gap:16px}.route,.typing{border:1px solid var(--border);border-radius:18px;background:var(--panel)}.route{position:relative;overflow:hidden}.route-head{display:flex;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--border)}.badge{display:inline-flex;padding:7px 11px;border-radius:999px;background:var(--accent-soft);color:var(--accent-dark);font-size:14px;font-weight:700}.viewport{position:relative;height:500px;overflow:hidden}.track{position:absolute;inset:0 auto 0 50%;width:8px;transform:translateX(-50%);border-radius:999px;background:var(--track)}.stations{position:absolute;top:0;left:0;width:100%;will-change:transform;transition:transform .52s cubic-bezier(.2,.75,.25,1)}.station{position:absolute;left:0;width:100%;height:92px}.dot{position:absolute;top:36px;left:50%;width:24px;height:24px;transform:translate(-50%,-50%);border:5px solid var(--track);border-radius:50%;background:var(--panel2);z-index:3}.label{position:absolute;top:20px;left:calc(50% + 30px);width:calc(50% - 46px);line-height:1.25}.station:nth-child(even) .label{right:calc(50% + 30px);left:auto;text-align:right}.name{font-size:20px;font-weight:800}.order{margin-top:4px;color:var(--muted);font-size:12px}.station.past .dot{border-color:#c8c1b8;background:#c8c1b8}.station.past .label,.station.past .order{color:var(--past)}.station.hidden{opacity:0}.station.current .dot{border-color:var(--accent);background:var(--panel2);box-shadow:0 0 0 9px var(--accent-soft)}.station.current .name{color:var(--accent-dark)}.taxi{position:absolute;z-index:6;top:232px;left:50%;width:86px;height:48px;transform:translate(-50%,-50%);border:4px solid var(--accent-dark);border-radius:18px 22px 13px 13px;background:#f2b84b}.taxi:before{content:"TAXI";position:absolute;top:-22px;left:50%;transform:translateX(-50%);padding:3px 8px;border:3px solid var(--accent-dark);border-radius:7px 7px 3px 3px;background:#fff3b0;color:var(--accent-dark);font-size:10px;font-weight:900;letter-spacing:.5px}.taxi:after{content:"";position:absolute;left:13px;right:13px;top:9px;height:17px;border-radius:9px 12px 4px 4px;background:linear-gradient(90deg,#f8f0df 0 46%,var(--accent-dark) 46% 51%,#f8f0df 51% 100%)}.taxi-wheel{position:absolute;z-index:7;top:251px;width:18px;height:18px;border:4px solid var(--accent-dark);border-radius:50%;background:#f5eddc}.taxi-wheel.left{left:calc(50% - 31px)}.taxi-wheel.right{left:calc(50% + 13px)}.taxi-tag{position:absolute;z-index:8;top:164px;left:50%;transform:translateX(-50%);padding:6px 10px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;font-weight:800}.countdown{position:absolute;inset:59px 0 0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,250,240,.93);backdrop-filter:blur(3px)}.countdown.hide{display:none}.countnum{display:grid;width:102px;height:102px;place-items:center;border:7px solid var(--accent);border-radius:50%;background:var(--panel2);color:var(--accent-dark);font-size:46px;font-weight:900;animation:pop .8s ease-out}@keyframes pop{0%{transform:scale(.65);opacity:0}38%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}.typing{padding:20px}.top{display:flex;justify-content:space-between;margin-bottom:18px}.target{padding:36px 20px;border:1px solid var(--border);border-radius:16px;background:var(--panel2);text-align:center}.target .big{margin:10px 0;font-size:clamp(42px,8vw,68px);font-weight:900}.small{color:var(--muted);font-size:14px}#typingInput{margin-top:18px;text-align:center;font-size:30px;font-weight:800}#typingInput.error{border-color:var(--danger);box-shadow:0 0 0 3px rgba(189,62,53,.14)}.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}.mini div{padding:12px;border:1px solid var(--border);border-radius:12px;text-align:center;background:var(--panel2)}.mini span{display:block;color:var(--muted);font-size:12px}.mini strong{display:block;margin-top:5px}.feedback{min-height:24px;margin:16px 0 0;color:var(--muted);text-align:center}.result{display:none;padding:18px;border:1px solid var(--accent);border-radius:16px;background:var(--accent-soft)}.result.show{display:block}@media(max-width:820px){.app{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.viewport{height:430px}.taxi{top:197px}.taxi-wheel{top:216px}.taxi-tag{top:129px}}
</style>
</head>
<body>
<main class="app">
<section id="select" class="screen active"><header class="header"><h1>순서 타자 여행</h1><p>학습할 주제를 선택하세요. 화면에 나타나는 항목을 빠르게 입력하며 순서를 익힐 수 있습니다.</p></header><div id="gameGrid" class="grid"></div></section>
<section id="play" class="screen">
<div class="toolbar"><div class="group"><button id="backBtn" class="btn">← 게임 선택</button><label>반복 횟수<select id="repeat"><option value="1">1회</option><option value="2">2회</option><option value="3">3회</option></select></label></div><div class="group"><button id="startBtn" class="btn primary">연습 시작</button><button id="resetBtn" class="btn">초기화</button></div></div>
<section class="stats"><div class="stat"><span>현재 위치</span><strong id="current">-</strong></div><div class="stat"><span>현재 속도</span><strong id="cpm">0</strong></div><div class="stat"><span>정확도</span><strong id="accuracy">100%</strong></div><div class="stat"><span>경과 시간</span><strong id="elapsed">0.0초</strong></div></section>
<section class="layout"><div class="route"><div class="route-head"><span id="lineBadge" class="badge"></span><span id="progress">0 / 0</span></div><div class="viewport"><div class="track"></div><div id="stations" class="stations"></div><div class="train-tag">내 위치</div><div class="train"></div></div><div id="countdown" class="countdown hide"><div id="countnum" class="countnum">3</div><div id="countlabel" style="margin-top:12px;font-weight:800">입력 준비</div></div></div>
<div class="typing"><div class="top"><span id="status" class="badge">시작 대기</span><span id="repeatText">1회차</span></div><div class="target"><div id="itemNumber" class="small"></div><div id="targetItem" class="big"></div><div id="nextPreview" class="small"></div></div><label>표시된 내용을 입력하고 Enter<input id="typingInput" type="text" autocomplete="off" spellcheck="false" disabled placeholder="내용을 입력하세요"></label><div class="mini"><div><span>완료</span><strong id="completed">0개</strong></div><div><span>오타</span><strong id="mistakes">0회</strong></div><div><span>최고 속도</span><strong id="best">0타/분</strong></div></div><p id="feedback" class="feedback">연습 시작을 누르면 3초 뒤 시작됩니다.</p></div></section>
<section id="result" class="result"><strong>연습 완료</strong><p id="resultText"></p></section>
</section>
</main>
<script>
const GAMES=[
{id:"joseon",title:"조선 왕호",description:"조선의 왕호를 순서대로 입력합니다.",lineName:"조선 왕호선",unit:"대",icon:"王",enabled:true,items:["태조","정종","태종","세종","문종","단종","세조","예종","성종","연산군","중종","인종","명종","선조","광해군","인조","효종","현종","숙종","경종","영조","정조","순조","헌종","철종","고종","순종"]},
{id:"goryeo",title:"고려 왕호",description:"고려 왕호 순서 타자 연습입니다.",lineName:"고려 왕호선",unit:"대",icon:"高",enabled:false,items:[]},
{id:"silla",title:"신라 왕호",description:"신라 왕호 순서 타자 연습입니다.",lineName:"신라 왕호선",unit:"대",icon:"新",enabled:false,items:[]},
{id:"baekje",title:"백제 왕호",description:"백제 왕호 순서 타자 연습입니다.",lineName:"백제 왕호선",unit:"대",icon:"百",enabled:false,items:[]}
];
const $=id=>document.getElementById(id),E={select:$("select"),play:$("play"),gameGrid:$("gameGrid"),backBtn:$("backBtn"),repeat:$("repeat"),startBtn:$("startBtn"),resetBtn:$("resetBtn"),current:$("current"),cpm:$("cpm"),accuracy:$("accuracy"),elapsed:$("elapsed"),lineBadge:$("lineBadge"),progress:$("progress"),stations:$("stations"),countdown:$("countdown"),countnum:$("countnum"),countlabel:$("countlabel"),status:$("status"),repeatText:$("repeatText"),itemNumber:$("itemNumber"),targetItem:$("targetItem"),nextPreview:$("nextPreview"),typingInput:$("typingInput"),completed:$("completed"),mistakes:$("mistakes"),best:$("best"),feedback:$("feedback"),result:$("result"),resultText:$("resultText")};
const S={game:null,running:false,counting:false,started:0,timer:null,countTimer:null,index:0,round:1,totalRounds:1,totalTyped:0,correctTyped:0,mistakes:0,best:0};
const GAP=92,TRAIN_Y=232;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function cards(){E.gameGrid.innerHTML=GAMES.map(g=>`<button class="card ${g.enabled?'':'disabled'}" data-id="${g.id}" ${g.enabled?'':'disabled'}><span class="icon">${g.icon}</span><h2>${esc(g.title)}</h2><p>${esc(g.description)}</p><strong>${g.enabled?g.items.length+'개 항목 · 시작하기':'준비 중'}</strong></button>`).join('');E.gameGrid.querySelectorAll('[data-id]:not([disabled])').forEach(b=>b.addEventListener('click',()=>openGame(GAMES.find(g=>g.id===b.dataset.id))))}
function openGame(g){S.game=g;E.select.classList.remove('active');E.play.classList.add('active');E.lineBadge.textContent=g.lineName;document.title=g.title+' 타자 연습';reset()}
function back(){clearTimers();S.game=null;E.play.classList.remove('active');E.select.classList.add('active');document.title='순서 타자 여행'}
function clearTimers(){clearInterval(S.timer);clearInterval(S.countTimer)}
function items(){return S.game.items}function done(){return(S.round-1)*items().length+S.index}function total(){return items().length*S.totalRounds}
function speed(){if(!S.running)return 0;return Math.round(S.correctTyped/Math.max((Date.now()-S.started)/60000,1/60))}
function stats(){const sec=S.running?(Date.now()-S.started)/1000:0,sp=speed(),acc=S.totalTyped===0?100:Math.round(S.correctTyped/S.totalTyped*100);S.best=Math.max(S.best,sp);E.cpm.textContent=sp;E.accuracy.textContent=acc+'%';E.elapsed.textContent=sec.toFixed(1)+'초';E.completed.textContent=done()+'개';E.mistakes.textContent=S.mistakes+'회';E.best.textContent=S.best+'타/분';E.progress.textContent=Math.min(S.index,items().length)+' / '+items().length}
function renderStations(){E.stations.innerHTML=items().map((it,i)=>{const d=i-S.index;return`<div class="station ${d<0?'past':''} ${d===0?'current':''} ${d<-2?'hidden':''}" style="top:${i*GAP}px"><div class="dot"></div><div class="label"><div class="name">${esc(it)}</div><div class="order">${i+1}${esc(S.game.unit||'')}</div></div></div>`}).join('');E.stations.style.transform=`translateY(${TRAIN_Y-(S.index*GAP+36)}px)`}
function show(){const a=items(),cur=a[S.index],next=S.index<a.length-1?a[S.index+1]:S.round<S.totalRounds?a[0]:null;E.current.textContent=cur;E.itemNumber.textContent=(S.index+1)+(S.game.unit||'번째')+' 항목';E.targetItem.textContent=cur;E.nextPreview.textContent=next?'다음: '+next:'마지막 항목입니다.';E.repeatText.textContent=S.round+'회차 / '+S.totalRounds+'회';E.typingInput.value='';E.typingInput.classList.remove('error');renderStations();stats();E.typingInput.focus()}
function restartAnim(){E.countnum.style.animation='none';void E.countnum.offsetWidth;E.countnum.style.animation='pop .8s ease-out'}
function begin(){S.counting=false;S.running=true;S.started=Date.now();E.countdown.classList.add('hide');E.status.textContent='진행 중';E.feedback.textContent='출발! 표시된 내용을 입력하고 Enter를 누르세요.';E.typingInput.value='';E.typingInput.focus();S.timer=setInterval(stats,100)}
function start(){clearTimers();S.running=false;S.counting=true;S.index=0;S.round=1;S.totalRounds=Number(E.repeat.value);S.totalTyped=0;S.correctTyped=0;S.mistakes=0;S.best=0;E.repeat.disabled=true;E.startBtn.disabled=true;E.typingInput.disabled=false;E.typingInput.value='';E.status.textContent='준비 중';E.feedback.textContent='입력창에 커서가 활성화되었습니다. 3초 뒤 시작합니다.';E.result.classList.remove('show');show();let c=3;E.countdown.classList.remove('hide');E.countnum.textContent=c;E.countlabel.textContent='입력 준비';S.countTimer=setInterval(()=>{c--;if(c>0){E.countnum.textContent=c;restartAnim();E.typingInput.focus()}else{clearInterval(S.countTimer);E.countnum.textContent='시작!';E.countnum.style.fontSize='22px';E.countlabel.textContent='지금 입력하세요';setTimeout(()=>{E.countnum.style.fontSize='';E.startBtn.disabled=false;E.startBtn.textContent='다시 시작';begin()},350)}},1000)}
function matched(a,b){let n=0;for(let i=0;i<Math.min(a.length,b.length);i++)if(a[i]===b[i])n++;return n}
function submit(){if(!S.running)return;const ans=E.typingInput.value.trim(),correct=items()[S.index];if(!ans)return;S.totalTyped+=ans.length;if(ans===correct){S.correctTyped+=correct.length;E.feedback.textContent=correct+' 통과';if(S.index<items().length-1){S.index++;show();return}if(S.round<S.totalRounds){S.round++;S.index=0;show();return}finish()}else{S.correctTyped+=matched(ans,correct);S.mistakes++;E.typingInput.classList.add('error');E.feedback.textContent=correct+'와 다릅니다. 다시 입력하세요.';E.typingInput.select();stats()}}
function finish(){S.running=false;clearInterval(S.timer);const sec=(Date.now()-S.started)/1000,final=Math.round(S.correctTyped/Math.max(sec/60,1/60)),acc=S.totalTyped===0?100:Math.round(S.correctTyped/S.totalTyped*100);E.typingInput.disabled=true;E.repeat.disabled=false;E.status.textContent='완료';E.current.textContent=items().at(-1);E.itemNumber.textContent=S.game.title;E.targetItem.textContent='완료';E.nextPreview.textContent=S.game.title+' 연습을 완료했습니다.';E.progress.textContent=items().length+' / '+items().length;E.completed.textContent=total()+'개';E.cpm.textContent=final;E.elapsed.textContent=sec.toFixed(1)+'초';S.index=items().length-1;renderStations();E.resultText.textContent=`평균 속도 ${final}타/분 · 정확도 ${acc}% · 완료 시간 ${sec.toFixed(1)}초 · 오타 ${S.mistakes}회`;E.result.classList.add('show')}
function reset(){clearTimers();if(!S.game)return;S.running=false;S.counting=false;S.index=0;S.round=1;S.totalRounds=Number(E.repeat.value);S.totalTyped=0;S.correctTyped=0;S.mistakes=0;S.best=0;E.countdown.classList.add('hide');E.repeat.disabled=false;E.startBtn.disabled=false;E.startBtn.textContent='연습 시작';E.typingInput.disabled=true;E.typingInput.value='';E.status.textContent='시작 대기';E.repeatText.textContent='1회차';E.feedback.textContent='연습 시작을 누르면 3초 뒤 시작됩니다.';E.result.classList.remove('show');E.cpm.textContent='0';E.accuracy.textContent='100%';E.elapsed.textContent='0.0초';E.completed.textContent='0개';E.mistakes.textContent='0회';E.best.textContent='0타/분';show()}
E.startBtn.addEventListener('click',start);E.resetBtn.addEventListener('click',reset);E.backBtn.addEventListener('click',back);E.typingInput.addEventListener('input',()=>{E.typingInput.classList.remove('error');if(S.counting)E.typingInput.value=''});E.typingInput.addEventListener('keydown',e=>{if(S.counting){e.preventDefault();return}if(e.key==='Enter'){e.preventDefault();submit()}});E.typingInput.addEventListener('paste',e=>{e.preventDefault();E.feedback.textContent='붙여넣기는 사용할 수 없습니다.'});cards();
</script>
</body>
</html>
